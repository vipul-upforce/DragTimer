name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./make-project.sh

      - name: Build Release app
        run: |
          xcodebuild \
            -project DragTimer.xcodeproj \
            -scheme DragTimer \
            -configuration Release \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p dist
          rm -rf dist/DragTimer.app
          cp -R .build/Build/Products/Release/DragTimer.app dist/DragTimer.app
          codesign -s - --force --deep dist/DragTimer.app

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export COPYFILE_DISABLE=1
          (
            cd dist
            ditto -c -k --keepParent --norsrc --noextattr --noqtn DragTimer.app "DragTimer-${VERSION}-macos.zip"
          )
          echo "ASSET=dist/DragTimer-${VERSION}-macos.zip" >> "$GITHUB_ENV"
          ls -lh dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DragTimer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DragTimer for macOS

            Free **menu bar timer** for Mac — drag the icon to set a duration, release to start.

            ### Install
            1. Download **DragTimer-*-macos.zip** below
            2. Unzip and move `DragTimer.app` to **Applications**
            3. Open the app (right-click → **Open** the first time if Gatekeeper warns)
            4. Find the timer icon in your menu bar

            **Requires macOS 13+.** Build is ad-hoc signed (not Apple-notarized).

            ### What's included
            - Drag-to-set timers · HUD · Option/Shift modifiers
            - Multiple timers · notifications · Focus/DND popup
            - Reminders sync · Launch at Login · Settings
          files: |
            dist/DragTimer-*-macos.zip
